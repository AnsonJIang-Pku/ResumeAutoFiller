<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Ambiguous dropdown fixture</title></head><body>
<main><h1>教育经历</h1><label>学校</label><div role="combobox" aria-label="学校" aria-expanded="false">请选择</div></main>
<script>
const control=document.querySelector('[role=combobox]');
control.addEventListener('click',()=>{ if(document.querySelector('[data-ambiguous-list]'))return; control.setAttribute('aria-expanded','true'); const menu=document.createElement('div'); menu.setAttribute('data-ambiguous-list','true'); menu.setAttribute('role','listbox'); ['北京大学','北京大学'].forEach(label=>{const option=document.createElement('div'); option.setAttribute('role','option'); option.textContent=label; menu.append(option);}); document.body.append(menu);});
</script></body></html>
