<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Native form fixture</title></head><body>
<main><h1>基本信息</h1><form>
<label for="name">姓名</label><input id="name" name="fullName" type="text">
<label for="email">邮箱</label><input id="email" name="email" type="email">
<label for="phone">手机号</label><input id="phone" name="phone" type="tel">
<label for="city">现居城市</label><input id="city" name="currentCity" type="text">
<label for="address">地址</label><textarea id="address" name="address"></textarea>
<button type="submit">提交申请</button></form></main></body></html>
