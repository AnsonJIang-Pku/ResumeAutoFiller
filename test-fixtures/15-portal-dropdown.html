<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Portal dropdown fixture</title></head><body>
<main><h1>教育经历</h1><label>学校</label><div role="combobox" aria-label="学校" aria-expanded="false">请选择</div></main>
<script>
const control=document.querySelector('[role=combobox]');
control.addEventListener('click',()=>{ if(document.querySelector('[data-portal-list]'))return; const menu=document.createElement('div'); menu.setAttribute('data-portal-list','true'); menu.setAttribute('role','listbox'); ['本科示例大学','虚构大学','示例学院'].forEach(label=>{const option=document.createElement('div'); option.setAttribute('role','option'); option.textContent=label; option.addEventListener('click',()=>{control.textContent=label; control.setAttribute('aria-valuetext',label); menu.remove();}); menu.append(option);}); document.body.append(menu);});
</script></body></html>
