<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Element Select fixture</title></head><body>
<main><h1>基本信息</h1><div class="el-form-item"><label>性别</label><div class="el-select" role="combobox" aria-haspopup="listbox" aria-expanded="false"><div class="el-input"><input readonly value="请选择"></div></div></div></main>
<script>
const control=document.querySelector('.el-select');
control.addEventListener('click',()=>{ if(document.querySelector('.el-select-dropdown'))return; control.setAttribute('aria-expanded','true'); const menu=document.createElement('div'); menu.className='el-select-dropdown'; ['男','女'].forEach(label=>{const option=document.createElement('div'); option.className='el-select-dropdown__item'; option.setAttribute('role','option'); option.setAttribute('aria-selected','false'); option.textContent=label; option.addEventListener('click',()=>{control.querySelector('input').value=label; control.setAttribute('aria-valuetext',label); option.setAttribute('aria-selected','true'); control.setAttribute('aria-expanded','false'); menu.remove();}); menu.append(option);}); document.body.append(menu);});
</script></body></html>
